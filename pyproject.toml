[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termiai"
version = "0.1.0.dev0"
description = "Operate your computer in plain language, with safety controls you can trust."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # core is stdlib-only; M6 adds typer/rich/litellm as they land

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
termiai = "termiai.cli:main"

[tool.setuptools.packages.find]
include = ["termiai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]  # line length is handled by `ruff format`
